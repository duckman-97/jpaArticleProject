<!DOCTYPE html>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


<body>
    <h1>
        회원가입
    </h1>

    <form method="POST" action="/" id="memberJoinForm" name="memberJoinForm">
        <label for="memberLoginId">아이디</label><input type="text" id="memberLoginId" name="memberLoginId" placeholder="아이디를 입력해주세요" />
        <label for="memberLoginPw">비밀번호</label><input type="password" id="memberLoginPw" name="memberLoginPw" placeholder="비밀번호를 입력해 주세요" />
        <label for="memberLoginPw2">비밀번호 확인</label><input type="password" id="memberLoginPw2" name="memberLoginPw2" placeholder="비밀번호를 다시 입력해 주세요" />

        <button type="button" id="memberJoinSubmit" name="memberJoinSubmit">회원가입</button>
    </form>

</body>

<script>
    $(document).ready(function(){

        $("#memberJoinSubmit").on("click",function(){
            var memberJoinForm = $("#memberJoinForm");
            var memberLoginId = $("#memberLoginId").val();
            var memberLoginPw = $("#memberLoginPw").val();
            var memberLoginPw2 = $("#memberLoginPw2").val();

            if(memberLoginId.trim() == null || memberLoginId.trim() === ""){
                alert("사용하실 아이디를 입력해 주세요.");
                $("#memberLoginId").focus();
                return;
            }

            if(memberLoginPw.trim() == null || memberLoginPw.trim() === ""){
                alert("사용하실 비밀번호를 입력해 주세요.");
                $("#memberLoginPw").focus();
                return;
            }

            if(memberLoginPw2.trim() == null || memberLoginPw2.trim() === ""){
                alert("비밀번호 확인을 입력해 주세요.");
                $("#memberLoginPw2").focus();
                return;
            }

            if(memberLoginPw !== memberLoginPw2){
                alert("비밀번호 확인이 일치하지 않습니다.");
                $("#memberLoginPw2").focus();
                return;
            }

            memberJoinForm.attr("action" , "/joinMemberInsert");
            memberJoinForm.submit();



        });

    });

</script>
